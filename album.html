<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Album Ảnh Tốt Nghiệp</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
<style>
    :root { --ink:#684d5a; --muted:#a58695; --pink:#db9db8; --line:#f0dce5; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:#fff9fb; color:var(--ink); font-family:"DM Sans",sans-serif; }
    button { font-family:"DM Sans",sans-serif; }
    button:focus-visible { outline:3px solid #a3577b; outline-offset:4px; }
    .page { min-height:100vh; display:grid; place-items:center; padding:28px 16px; background:radial-gradient(ellipse at 50% 30%,#fff 0%,#fff9fb 58%,#fbeef3 100%); overflow:hidden; }
    .album { position:relative; width:min(100%,920px); padding:44px 34px 36px; text-align:center; background:rgba(255,255,255,.8); border:1px solid #f5e5eb; border-radius:32px; box-shadow:0 22px 70px rgba(158,98,127,.09); }
    .album-header { position:relative; z-index:1; }
    .eyebrow { margin:0 0 13px; color:#bd829e; font-size:11px; font-weight:700; letter-spacing:.32em; }
    h1 { margin:0; color:#895c72; font-size:clamp(28px,5vw,45px); font-weight:600; letter-spacing:.095em; line-height:1.25; }
    .subtitle { margin:13px 0 0; color:var(--muted); font-size:12px; letter-spacing:.14em; }
    .bow { position:absolute; width:78px; height:65px; fill:none; stroke:#d9a7bd; stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
    .bow-left { top:34px; left:24px; transform:rotate(-16deg); }
    .bow-right { top:55px; right:28px; transform:rotate(18deg) scale(.72); opacity:.75; }
    .bow-bottom { bottom:28px; right:65px; transform:rotate(-12deg) scale(.55); opacity:.6; }
    .gallery-section { margin:31px auto 0; }
    .gallery { position:relative; height:380px; overflow:hidden; touch-action:pan-y; user-select:none; }
    .photo-card { position:absolute; top:50%; left:50%; display:block; width:254px; height:328px; padding:7px; overflow:hidden; border:1px solid #f3e1e9; border-radius:20px; background:#fff; box-shadow:0 13px 30px rgba(107,62,84,.15); cursor:pointer; transition:transform .95s cubic-bezier(.45,0,.55,1),opacity .95s cubic-bezier(.45,0,.55,1),box-shadow .95s cubic-bezier(.45,0,.55,1); will-change:transform,opacity; transform:translate(-50%,-50%); }
    .photo-card img { display:block; width:100%; height:100%; object-fit:cover; border-radius:14px; }
    .photo-card[data-offset="0"] { z-index:6; transform:translate(-50%,-50%) scale(1); box-shadow:0 20px 42px rgba(107,62,84,.21); cursor:default; }
    .photo-card[data-offset="-1"] { z-index:5; transform:translate(calc(-50% - 190px),-50%) scale(.76) rotate(-3deg); }
    .photo-card[data-offset="1"] { z-index:5; transform:translate(calc(-50% + 190px),-50%) scale(.76) rotate(3deg); }
    .photo-card[data-offset="-2"] { z-index:4; transform:translate(calc(-50% - 330px),-50%) scale(.58) rotate(-5deg); opacity:.78; }
    .photo-card[data-offset="2"] { z-index:4; transform:translate(calc(-50% + 330px),-50%) scale(.58) rotate(5deg); opacity:.78; }
    .photo-card[data-offset="3"] { z-index:3; transform:translate(calc(-50% + 470px),-50%) scale(.45); opacity:0; pointer-events:none; }
    .photo-card[data-offset="-3"] { z-index:3; transform:translate(calc(-50% - 470px),-50%) scale(.45); opacity:0; pointer-events:none; }
    .photo-card.no-transition { transition:none !important; }
    .controls { display:flex; align-items:center; justify-content:center; gap:22px; margin:7px 0 0; }
    .arrow { display:grid; place-items:center; width:43px; height:43px; padding:0; border:1px solid #edcfdd; border-radius:50%; background:#fff; color:#a8708a; cursor:pointer; box-shadow:0 4px 12px rgba(147,82,110,.07); }
    .arrow:hover { background:#fceef4; }
    .arrow svg { width:18px; height:18px; }
    .counter { min-width:76px; color:#9c7185; font-size:13px; font-weight:600; letter-spacing:.14em; }
    .counter .current { color:#8e5671; }
    .hint { margin:16px 0 0; color:#b394a3; font-size:10px; letter-spacing:.18em; }
    @media(max-width:600px) {
      .page { padding:12px; }
      .album { padding:49px 12px 30px; border-radius:24px; }
      .eyebrow { font-size:9px; letter-spacing:.24em; }
      h1 { font-size:clamp(24px,7vw,34px); letter-spacing:.045em; }
      .subtitle { font-size:10px; }
      .bow-left { top:5px; left:8px; transform:rotate(-16deg) scale(.55); }
      .bow-right { top:15px; right:5px; transform:rotate(18deg) scale(.48); }
      .bow-bottom { bottom:7px; right:3px; transform:scale(.4); }
      .gallery-section { margin-top:22px; }
      .gallery { height:340px; }
      .photo-card { width:218px; height:290px; border-radius:18px; }
      .photo-card img { border-radius:12px; }
      .photo-card[data-offset="-1"] { transform:translate(calc(-50% - 37vw),-50%) scale(.68) rotate(-3deg); }
      .photo-card[data-offset="1"] { transform:translate(calc(-50% + 37vw),-50%) scale(.68) rotate(3deg); }
      .photo-card[data-offset="-2"] { transform:translate(calc(-50% - 68vw),-50%) scale(.48) rotate(-5deg); opacity:.55; }
      .photo-card[data-offset="2"] { transform:translate(calc(-50% + 68vw),-50%) scale(.48) rotate(5deg); opacity:.55; }
    }
    @media(prefers-reduced-motion:reduce) { .photo-card { transition:none; } }
  
.preview-nav{display:none!important}
/* Album phủ toàn bộ khung như trang mở thiệp */
html,body{width:100%;max-width:100%;margin:0;overflow-x:hidden}
.page{width:100%;min-height:100vh;min-height:100dvh;padding:0;display:flex;align-items:center;justify-content:center}
.album{width:100%;max-width:none;min-height:100vh;min-height:100dvh;border:0;border-radius:0;box-shadow:none;background:transparent;padding:clamp(46px,8vh,85px) 16px 40px;display:flex;flex-direction:column;justify-content:center}
.gallery{width:100%;max-width:100%;}
@media(max-width:600px){
 .page{padding:0}
 .album{border-radius:0;padding:48px 12px 32px}
 .album-header{width:100%}
 .gallery{height:min(44dvh,350px);min-height:280px}
 .photo-card{width:min(57vw,218px);height:min(39dvh,290px)}
 .bow-left{left:0}.bow-right{right:0}
}
</style>



<style>
 .preview-nav{position:fixed;z-index:9999;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;max-width:calc(100vw - 20px);padding:6px;background:rgba(255,255,255,.94);border:1px solid #e9cbd8;border-radius:99px;box-shadow:0 6px 25px #74455b25;backdrop-filter:blur(12px)}
 .preview-nav a{color:#985c6c;font:600 11px/1.3 Arial,sans-serif;text-decoration:none;white-space:nowrap;padding:10px 12px;border-radius:99px}
 .preview-nav a[aria-current="page"]{background:#e9bfd0;color:#694458}
 body{padding-bottom:62px!important}
 </style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet"><style id="vietnamese-playfair-fix">
/* Playfair Display with Vietnamese glyphs, avoid accent splitting caused by tracking */
html,body,button,input,textarea,select,option,*:not(svg):not(path){font-family:"Playfair Display",Georgia,serif!important}
h1,h2,h3,h4,h5,h6,p,label,a,button,input,textarea,span{letter-spacing:normal!important;word-spacing:normal!important;text-rendering:optimizeLegibility}
h1,h2,h3,h4,h5,h6{line-height:1.35}
button,input,textarea{font-synthesis:none}
</style></head>
<body>
<main class="page canva-section">
<article aria-labelledby="album-title" class="album canva-card">
<svg aria-hidden="true" class="bow bow-left" viewbox="0 0 125 95">
<path d="M62 43C46 22 20 8 12 25c-8 17 24 26 49 23M64 43c18-23 43-34 50-18 9 19-21 25-49 23M59 44c-4 6-2 12 4 12 8 0 10-9 2-13-3-2-5-1-6 1ZM60 56c-9 12-19 22-24 31 9-2 18-5 27-13M69 55c12 10 20 18 26 31-12-2-22-6-31-13"></path>
</svg>
<svg aria-hidden="true" class="bow bow-right" viewbox="0 0 125 95">
<path d="M62 43C46 22 20 8 12 25c-8 17 24 26 49 23M64 43c18-23 43-34 50-18 9 19-21 25-49 23M59 44c-4 6-2 12 4 12 8 0 10-9 2-13-3-2-5-1-6 1ZM60 56c-9 12-19 22-24 31 9-2 18-5 27-13M69 55c12 10 20 18 26 31-12-2-22-6-31-13"></path>
</svg>
<header class="album-header canva-header">
<p class="eyebrow canva-text">KHOẢNH KHẮC ĐÁNG NHỚ</p>
<h1 class="canva-text" id="album-title">ALBUM ẢNH TỐT NGHIỆP CỦA NHI</h1>

</header>
<section aria-label="Bộ sưu tập ảnh tốt nghiệp" class="gallery-section canva-section">
<div aria-label="Album ảnh tốt nghiệp, vuốt hoặc bấm để chuyển ảnh" class="gallery" id="gallery" role="group"><button aria-label="Xem ảnh 1" class="photo-card canva-card" data-index="0" type="button"><img alt="Người tốt nghiệp cầm bó hoa trong khung cảnh ngoài trời" class="canva-image" id="graduation-photo-1" loading="eager" src="https://images.pexels.com/photos/36027857/pexels-photo-36027857.jpeg"/></button> <button aria-label="Xem ảnh 2" class="photo-card canva-card" data-index="1" type="button"><img alt="Người tốt nghiệp mỉm cười và cầm bằng tốt nghiệp" class="canva-image" id="graduation-photo-2" loading="lazy" src="https://images.pexels.com/photos/9829310/pexels-photo-9829310.jpeg"/></button> <button aria-label="Xem ảnh 3" class="photo-card canva-card" data-index="2" type="button"><img alt="Người tốt nghiệp chụp ảnh ngoài trời cùng bằng tốt nghiệp" class="canva-image" id="graduation-photo-3" loading="lazy" src="https://images.pexels.com/photos/8093015/pexels-photo-8093015.jpeg"/></button> <button aria-label="Xem ảnh 4" class="photo-card canva-card" data-index="3" type="button"><img alt="Ba người bạn cùng chụp ảnh tốt nghiệp ngoài trời" class="canva-image" id="graduation-photo-4" loading="lazy" src="https://images.pexels.com/photos/8106627/pexels-photo-8106627.jpeg"/></button> <button aria-label="Xem ảnh 5" class="photo-card canva-card" data-index="4" type="button"><img alt="Người tốt nghiệp cầm bằng và tạo dáng ngoài trời" class="canva-image" id="graduation-photo-5" loading="lazy" src="https://images.pexels.com/photos/38595020/pexels-photo-38595020.jpeg"/></button> <button aria-label="Xem ảnh 6" class="photo-card canva-card" data-index="5" type="button"><img alt="Khoảnh khắc ăn mừng ngày tốt nghiệp" class="canva-image" id="graduation-photo-6" loading="lazy" src="https://images.pexels.com/photos/8093004/pexels-photo-8093004.jpeg"/></button>
</div>
<div class="controls"><button aria-label="Ảnh trước" class="arrow canva-button" id="previous-photo" type="button"><i data-lucide="arrow-left"></i></button>
<div aria-live="polite" class="counter canva-text" id="photo-counter">
<span class="current">01</span> / 06
      </div><button aria-label="Ảnh tiếp theo" class="arrow canva-button" id="next-photo" type="button"><i data-lucide="arrow-right"></i></button>
</div>
<p class="hint canva-text">VUỐT HOẶC BẤM ĐỂ XEM ẢNH</p>
</section>
<svg aria-hidden="true" class="bow bow-bottom" viewbox="0 0 125 95">
<path d="M62 43C46 22 20 8 12 25c-8 17 24 26 49 23M64 43c18-23 43-34 50-18 9 19-21 25-49 23M59 44c-4 6-2 12 4 12 8 0 10-9 2-13-3-2-5-1-6 1ZM60 56c-9 12-19 22-24 31 9-2 18-5 27-13M69 55c12 10 20 18 26 31-12-2-22-6-31-13"></path>
</svg>
</article>
</main>
<script>
    const gallery = document.getElementById('gallery');
    const cards = [...gallery.querySelectorAll('.photo-card')];
    const counter = document.getElementById('photo-counter');
    let active = 0;
    let touchStartX = null;
    let autoplayTimer;
    let settleTimer;
    let moving = false;
    let queuedDirection = 0;
    const interval = 1500;
    const transitionDuration = 950;

    function offsetFor(i, center) {
      let offset = (i - center + cards.length) % cards.length;
      if (offset > Math.floor(cards.length / 2)) offset -= cards.length;
      return offset;
    }

    // Prepare every original image before it can enter the visible stack.
    const ready = cards.map(card => {
      const img = card.querySelector('img');
      img.loading = 'eager';
      img.fetchPriority = 'high';
      return img.decode ? img.decode().catch(() => {}) : Promise.resolve();
    });

    function scheduleNext() {
      clearTimeout(autoplayTimer);
      if (!document.hidden) autoplayTimer = setTimeout(() => showPhoto(active + 1), interval);
    }

    function moveCardInstantly(card, offset) {
      card.classList.add('no-transition');
      card.dataset.offset = String(offset);
      void card.offsetWidth;
    }

    async function showPhoto(index, initial = false) {
      if (!initial) {
        scheduleNext(); // Any manual interaction starts a fresh 1.5-second interval.
        if (moving) { queuedDirection = index > active ? 1 : -1; return; }
        const next = (index + cards.length) % cards.length;
        await ready[next];
        if (moving) return;
      }
      clearTimeout(settleTimer);
      const previous = active;
      const direction = initial ? 0 : index === active - 1 || (index !== active + 1 && (index + cards.length) % cards.length === (active - 1 + cards.length) % cards.length) ? -1 : 1;
      active = (previous + direction + cards.length) % cards.length;
      if (!initial) moving = true;

      // The sixth card waits outside the clipped gallery. Move it to the entry side
      // before animation, while the departing card slides out on the opposite side.
      cards.forEach((card, i) => {
        if (direction === 1 && Number(card.dataset.offset) === -3) moveCardInstantly(card, 3);
        if (direction === -1 && Number(card.dataset.offset) === 3) moveCardInstantly(card, -3);
      });
      if (!initial) void gallery.offsetWidth;
      cards.forEach(card => { if (!initial) card.classList.remove('no-transition'); });
      let departing;
      cards.forEach((card, i) => {
        const oldOffset = initial ? 0 : Number(card.dataset.offset);
        let offset = offsetFor(i, active);
        if (direction === 1 && oldOffset === -2) { offset = -3; departing = card; }
        if (direction === -1 && oldOffset === 2) { offset = 3; departing = card; }
        if (initial) card.classList.add('no-transition');
        card.dataset.offset = String(offset);
        card.setAttribute('aria-current', i === active ? 'true' : 'false');
        card.tabIndex = Math.abs(offset) <= 1 ? 0 : -1;
      });
      counter.innerHTML = '<span class="current">' + String(active + 1).padStart(2, '0') + '</span> / ' + String(cards.length).padStart(2, '0');
      if (initial) {
        requestAnimationFrame(() => requestAnimationFrame(() => cards.forEach(card => card.classList.remove('no-transition'))));
      } else {
        settleTimer = setTimeout(() => {
          if (departing) moveCardInstantly(departing, direction === 1 ? 3 : -3);
          requestAnimationFrame(() => cards.forEach(card => card.classList.remove('no-transition')));
          moving = false;
          if (queuedDirection) {
            const nextDirection = queuedDirection;
            queuedDirection = 0;
            showPhoto(active + nextDirection);
          }
        }, transitionDuration + 25);
      }
      scheduleNext();
    }

    cards.forEach((card, index) => card.addEventListener('click', () => showPhoto(index)));
    document.getElementById('previous-photo').addEventListener('click', () => showPhoto(active - 1));
    document.getElementById('next-photo').addEventListener('click', () => showPhoto(active + 1));
    gallery.addEventListener('touchstart', event => { touchStartX = event.changedTouches[0].screenX; }, { passive:true });
    gallery.addEventListener('touchend', event => {
      if (touchStartX === null) return;
      const distance = event.changedTouches[0].screenX - touchStartX;
      if (Math.abs(distance) > 35) showPhoto(active + (distance < 0 ? 1 : -1));
      touchStartX = null;
    }, { passive:true });
    gallery.addEventListener('keydown', event => {
      if (event.key === 'ArrowRight') { event.preventDefault(); showPhoto(active + 1); }
      if (event.key === 'ArrowLeft') { event.preventDefault(); showPhoto(active - 1); }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) clearTimeout(autoplayTimer); else scheduleNext(); });
    showPhoto(0, true);
    lucide.createIcons();
  </script>
</body>
</html>
