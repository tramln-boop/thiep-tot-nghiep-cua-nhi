<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Thông tin lễ tốt nghiệp</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Montserrat:wght@400;500;600;700&amp;family=Playfair+Display:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
<style>
    :root {
      --ink: #985c6c;
      --muted: #ae808d;
      --rose: #ba788a;
      --line: #eccdd4;
      --paper: #fffaf8;
      --card: #f8e9ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f8f0ef;
      color: var(--ink);
      font-family: "Montserrat", sans-serif;
    }
    button, input, select, textarea { font-family: "Montserrat", sans-serif; }
    .page {
      min-height: 100vh;
      max-width: 540px;
      margin: 0 auto;
      padding: 52px 26px 64px;
      background: var(--paper);
    }
    .content { max-width: 420px; margin: 0 auto; }
    .page-header { text-align: center; }
    .eyebrow {
      margin: 0 0 13px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .23em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #a66375;
      font-family: "Great Vibes", cursive;
      font-size: clamp(47px, 11vw, 62px);
      font-weight: 400;
      line-height: 1.15;
    }
    .subtitle {
      margin: 7px 0 0;
      font-family: "Playfair Display", serif;
      font-size: 16px;
      line-height: 1.5;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 30px 0 23px;
      color: var(--rose);
    }
    .divider::before, .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }
    .divider-bow { width: 25px; height: 19px; flex: none; }
    .details { display: grid; gap: 11px; }
    .ceremony-date {
      padding: 12px 8px 32px;
      text-align: center;
      color: var(--ink);
    }
    .ceremony-date h2 {
      margin: 0 0 31px;
      font-family: "Playfair Display", serif;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: .08em;
    }
    .date-intro { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; line-height: 1.6; }
    .date-intro-sub { margin: 2px 0 15px; color: var(--muted); font-size: 10px; line-height: 1.6; }
    .ceremony-time { margin: 0 0 17px; font-family: "Playfair Display", serif; font-size: 39px; line-height: 1.2; overflow-wrap: anywhere; }
    .date-row { display: flex; align-items: center; justify-content: center; max-width: 360px; margin: 0 auto; }
    .date-part { flex: 1 1 0; min-width: 0; padding: 6px 5px; font-family: "Playfair Display", serif; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; }
    .date-part + .date-part { border-left: 1px solid var(--rose); }
    .date-number { flex: 0 0 28%; font-size: 39px; line-height: 1; }
    .date-year { margin: 18px 0 0; font-family: "Playfair Display", serif; font-size: 22px; }
    .date-note { margin: 16px 0 0; color: var(--muted); font-size: 10px; letter-spacing: .08em; line-height: 1.7; }
    .detail {
      padding: 18px 19px 19px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--card);
    }
    .detail-heading {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 11px;
      color: var(--rose);
    }
    .detail-heading svg { width: 15px; height: 15px; stroke-width: 1.5; }
    .label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .value {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: 20px;
      font-weight: 500;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .support {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.65;
    }
    #venue-section { padding: 14px 10px 18px; }
    #venue-section .detail-heading, #venue-section .value, #venue-section .directions-link { margin-left: 8px; margin-right: 8px; }
    .map-placeholder {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 548 / 277;
      margin: 0 0 13px;
      border: 1px solid #dcbbc4;
      border-radius: 9px;
      background: #f7efed;
      object-fit: contain;
      object-position: center;
    }
    .directions-link { display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; padding: 10px 17px; border: 1px solid var(--rose); border-radius: 8px; color: var(--ink); background: var(--paper); font-size: 12px; font-weight: 600; text-decoration: none; transition: background .2s; }
    .directions-link:hover { background: #f3dfe4; }
    .directions-link:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .directions-link svg { width: 15px; height: 15px; }
    .rsvp-section { padding: 10px 12px 27px; text-align: center; }
    .calendar { width: min(100%, 286px); margin: 0 auto; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; color: var(--ink); background: #fffaf8; }
    .calendar-title { margin: 0; padding: 10px 4px 8px; border-bottom: 1px solid var(--line); font-family: "Playfair Display", serif; font-size: 12px; font-weight: 600; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .calendar-weekdays { border-bottom: 1px solid var(--rose); background: var(--card); }
    .calendar-weekdays span { padding: 6px 0; font-size: 9px; font-weight: 600; }
    .calendar-days { padding: 5px 2px 8px; }
    .calendar-days span { display: flex; align-items: center; justify-content: center; height: 29px; font-family: "Playfair Display", serif; font-size: 11px; }
    .calendar-days .featured-day { width: 26px; height: 26px; margin: 1.5px auto; border-radius: 50%; background: var(--rose); color: white; font-weight: 600; }
    .add-calendar { display: inline-block; margin: 0 auto 18px; color: var(--ink); font-family: "Playfair Display", serif; font-size: 11px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    .add-calendar:hover { color: var(--rose); }
    .add-calendar:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
    .rsvp-button { display: flex; align-items: center; justify-content: center; width: max-content; max-width: 100%; min-height: 40px; margin: 0 auto; padding: 12px 28px; border: 1.5px solid #e8b9c9; border-radius: 999px; background: #fffdfd; color: #a56b81; box-shadow: 0 2px 8px rgba(165,107,129,.06); font-family: "Playfair Display", serif; font-size: 12px; font-weight: 600; letter-spacing: .03em; cursor: pointer; transition: background .2s; }
    .calendar + .rsvp-button { margin-top: 18px; }
    .rsvp-button:hover { background: #f9eaf0; border-color: #c98da5; }
    .rsvp-button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .rsvp-feedback { margin: 10px auto 0; max-width: 290px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .rsvp-feedback:empty { display: none; }
    @media (max-width: 380px) {
      .page { padding: 42px 20px 54px; }
      .detail { padding: 16px; }
      .value { font-size: 18px; }
    }
  
.preview-nav{display:none!important}

.venue-jump{display:inline-block;margin:5px auto 18px;padding:4px 8px;border:0;background:transparent;color:#a0647d;font-family:inherit;font-size:12px;font-weight:500;letter-spacing:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:28px}
.venue-name{margin:5px 0 0;font-family:"Playfair Display",Georgia,serif;font-size:clamp(20px,5vw,25px);font-weight:600;line-height:1.35;letter-spacing:0;color:#98627b}
.venue-jump:focus-visible{outline:2px solid #b57992;outline-offset:3px}
.date-intro{line-height:1.55;letter-spacing:0!important;max-width:340px;margin-left:auto;margin-right:auto}
</style>

 .preview-nav a{color:#985c6c;font:600 11px/1.3 Arial,sans-serif;text-decoration:none;white-space:nowrap;padding:10px 12px;border-radius:99px}

</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet"><style id="vietnamese-playfair-fix">

<style id="balanced-fullscreen-ceremony">

</style>

<body>
<main class="page canva-container">
<div class="content">
<header class="page-header canva-header">
<p class="eyebrow canva-text">Một cột mốc đáng nhớ</p>
<h1 class="canva-text" id="page-title">Graduation Day</h1>

</header>
<div aria-hidden="true" class="divider canva-divider">
<svg class="divider-bow" fill="none" viewbox="0 0 32 24"><path d="M15.7 10.5C11.2 5.4 5.6 4.3 3.5 7.3c-2 3 1.1 6.4 12.2 5.1M16.3 10.5c4.5-5.1 10.1-6.2 12.2-3.2 2 3-1.1 6.4-12.2 5.1" stroke="currentColor" stroke-linecap="round" stroke-width="1.2"></path> <path d="M13.5 13.2c-1 3.6-2.4 5.9-5.1 8.2 3.7-.9 6.3-2.4 8-5.9m2.1-2.3c1 3.6 2.4 5.9 5.1 8.2-3.7-.9-6.3-2.4-8-5.9" stroke="currentColor" stroke-linecap="round" stroke-width="1.2"></path> <path d="M13.3 10.4c1.5-1.2 4-1.2 5.4 0 1.2 1 .9 3.2-.2 3.8-1.3.7-3.7.7-5 0-1.1-.6-1.4-2.8-.2-3.8Z" fill="#f3d7de" stroke="currentColor" stroke-width="1.2"></path>
</svg>
</div>
<section aria-label="Chi tiết buổi lễ" class="details canva-section">
<section aria-labelledby="ceremony-date-heading" class="ceremony-date canva-section" id="date-card">
<h2 class="canva-text" id="ceremony-date-heading">THÔNG TIN NGÀY GIỜ BUỔI LỄ</h2>
<p class="date-intro canva-text">Lễ tốt nghiệp diễn ra tại</p>
<p class="venue-name canva-text">Nhà hát Hòa Bình</p>
<button class="venue-jump" type="button" id="venue-jump">Chỉ đường ↗</button>
<p class="ceremony-time canva-text" id="event-time">11:00</p>
<div aria-label="Ngày diễn ra buổi lễ" class="date-row" id="event-date">
<span class="date-part canva-text">THỨ 3</span> <span class="date-part date-number canva-text">17</span> <span class="date-part canva-text">THÁNG 11</span>
</div>

</section>
<section aria-labelledby="calendar-title" class="rsvp-section canva-section" id="rsvp-section">

<div class="portrait-stage"><img class="graduate-portrait" src="3c21e4d0-5aff-4059-9081-39143747358e.jpg" alt="Nhi trong trang phục tốt nghiệp" loading="eager" onerror="this.style.display='none'"/></div><button class="rsvp-button arrival-confirm" id="rsvp-button" type="button">XÁC NHẬN THAM DỰ</button>
<p aria-live="polite" class="rsvp-feedback canva-text" id="rsvp-feedback" role="status"></p>
</section>

</section>
</div>
</main>
<script>
    lucide.createIcons();
    document.getElementById('venue-jump').addEventListener('click', () => {
      window.parent.postMessage({type:'open-venue'}, '*');
    });
    document.getElementById('rsvp-button').addEventListener('click', () => {
      // The landing page hosts this section in an iframe.
      window.parent.postMessage({type:'open-guestbook'}, '*');
    });
  </script>
